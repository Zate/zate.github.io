<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zate</title>
  <meta name="description" content="Zate project index.">
  <style>
    :root {
      color-scheme: light dark;
      --bg: #0b1210;
      --card: #101d18;
      --text: #effff6;
      --muted: #a8c8b7;
      --accent: #7cff9f;
      --border: #274737;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px;
      background:
        radial-gradient(circle at 20% 20%, rgba(124, 255, 159, 0.14), transparent 28rem),
        radial-gradient(circle at 80% 10%, rgba(103, 216, 255, 0.10), transparent 26rem),
        var(--bg);
      color: var(--text);
      font: 18px/1.6 "Avenir Next", Avenir, "Trebuchet MS", sans-serif;
    }

    main {
      width: min(720px, 100%);
      padding: 36px;
      border: 1px solid var(--border);
      border-radius: 28px;
      background: color-mix(in srgb, var(--card) 86%, transparent);
      box-shadow: 0 28px 80px rgba(0, 0, 0, 0.32);
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(3rem, 12vw, 7rem);
      line-height: 0.9;
      letter-spacing: -0.08em;
    }

    p { color: var(--muted); }

    a {
      color: var(--accent);
      font-weight: 700;
    }

    .card {
      display: block;
      margin-top: 24px;
      padding: 20px;
      border: 1px solid var(--border);
      border-radius: 18px;
      text-decoration: none;
      background: rgba(124, 255, 159, 0.08);
    }

    .card strong {
      display: block;
      color: var(--text);
      font-size: 1.25rem;
    }

    .card span {
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main>
    <h1>Zate</h1>
    <p>This page is a small project index. More content can live here later.</p>
    <a class="card" href="https://zate.github.io/agent-help/">
      <strong>agent-help</strong>
      <span>An open convention for CLIs that AI agents can discover and use directly.</span>
    </a>
  </main>
</body>
</html>
